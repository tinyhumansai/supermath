# Opt-in override for rsi-ralph loops: lets the lean and python services read
# candidate checkouts in the rsi-ralph run store, which live outside the
# `projects` volume.
#
#   docker compose -f compose.yaml -f compose.rsi.yaml --profile host up -d lean python
#
# The run store ($TINYRSI_HOME, default ~/.tinyrsi) is bind-mounted read-only
# at the same absolute path inside both services, and SUPERMATH_ROOTS allows
# requests whose `root` lies inside it (`supermath-mcp call ... --project-dir
# <dir>` sends one). Nothing outside it is reachable, and nothing in it is
# written: lean builds such a project in a staged copy under its own /tmp
# (`build.stage`). The directory must exist before `up`, or Docker would
# create it as root.

x-rsi-home: &rsi-home ${TINYRSI_HOME:-${HOME}/.tinyrsi}

services:
  lean:
    environment:
      SUPERMATH_ROOTS: *rsi-home
    volumes:
      - type: bind
        source: *rsi-home
        target: *rsi-home
        read_only: true
        bind:
          create_host_path: false

  python:
    environment:
      SUPERMATH_ROOTS: *rsi-home
    volumes:
      - type: bind
        source: *rsi-home
        target: *rsi-home
        read_only: true
        bind:
          create_host_path: false
