# supermath: the services the toolkit calls, and its memory.
#
#   cp .env.example .env            # the Surplus Intelligence key
#   docker compose up -d            # CortexDB, Lean and Python
#
# By default:
#
#   cortexdb   the memory server, one per deployment, data in a named volume
#   lean       the pinned Lean service, no egress
#   python     the pinned Python solver service, no egress
#
# Opt-in profiles add `mcp` (the toolkit over MCP on stdio) and `host` (the
# lean-gateway and python-gateway, which publish both services on loopback for
# `supermath-mcp` on the host). The agents themselves run in the rsi-ralph
# binary (docs/specs/loops.md); compose.rsi.yaml mounts its run store.
#
# CortexDB's every chat completion and embedding goes straight to Surplus
# Intelligence (`SURPLUS_API_KEY`) with a concrete model name.

x-surplus-url: &surplus-url ${SURPLUS_URL:-https://api.surplusintelligence.ai/v1}
x-surplus-key: &surplus-key ${SURPLUS_API_KEY:?set SURPLUS_API_KEY in .env}

services:
  cortexdb:
    # Pinned by digest, the release cortexdb-saas runs. The engine is a closed
    # vendor binary published for amd64 only.
    image: cortexdb/cortexdb:v0.10.4@sha256:636e0ed0b8cd4ae2f307e3a90f99050f7879f73c556b1ccbbabf2d3a383398fc
    platform: linux/amd64
    restart: unless-stopped
    environment:
      # The operator key every request carries as a bearer token. The
      # toolkit reads the same variable, so the two cannot drift.
      CORTEX_API_KEY: ${CORTEX_API_KEY:-supermath-local}
      CORTEX_V1_API_ADDR: 0.0.0.0:3141
      # Everything that thinks goes to Surplus Intelligence. The server
      # decides whether it has a real provider at all from `OPENAI_API_KEY` /
      # `LLM_API_KEY`, so the Surplus key is given under that name too.
      OPENAI_API_KEY: *surplus-key
      LLM_API_KEY: *surplus-key
      # Embeddings on Surplus's `venice-embed-1`, asked for 1024 wide. The
      # server pins the width on first ingest, so changing the model or the
      # width needs a fresh volume.
      CORTEX_EMBEDDING_URL: *surplus-url
      CORTEX_EMBEDDING_MODEL: ${SUPERMATH_EMBEDDING_MODEL:-venice-embed-1}
      CORTEX_EMBEDDING_DIMS: ${SUPERMATH_EMBEDDING_DIMS:-1024}
      CORTEX_EMBEDDING_API_KEY: *surplus-key
      # Extraction, enrichment, answers and verification on a cheap, fast
      # Surplus model. Enrichment builds facts from notes; unset turns it off.
      CORTEX_LLM_URL: *surplus-url
      CORTEX_LLM_MODEL: ${CORTEX_CHAT_MODEL:-deepseek-v4.1-flash}
      CORTEX_ENTITY_API_KEY: *surplus-key
      CORTEX_ENRICHMENT_DELAY_SECONDS: "0"
      CORTEX_ENRICHMENT_URL: *surplus-url
      CORTEX_ENRICHMENT_MODEL: ${CORTEX_CHAT_MODEL:-deepseek-v4.1-flash}
      CORTEX_ENRICHMENT_API_KEY: *surplus-key
      CORTEX_ANSWER_PROVIDER: openai
      CORTEX_ANSWER_URL: *surplus-url
      CORTEX_ANSWER_MODEL: ${CORTEX_CHAT_MODEL:-deepseek-v4.1-flash}
      CORTEX_ANSWER_API_KEY: *surplus-key
      CORTEX_VERIFIER_URL: *surplus-url
      CORTEX_VERIFIER_MODEL: ${CORTEX_CHAT_MODEL:-deepseek-v4.1-flash}
      CORTEX_VERIFIER_API_KEY: *surplus-key
      # Episodes, beliefs and concepts are built by a background scheduler
      # that is off unless this is set.
      CORTEX_V1_LAYERS_AUTO: "1"
      CORTEX_VECTOR_RESIDENT_MAX: ${CORTEX_VECTOR_RESIDENT_MAX:-200000}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3141/v1/admin/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: ${CORTEX_MEM_LIMIT:-4g}
    # Loopback only: `supermath-mcp` on the host (and an rsi-ralph loop's
    # tools) reach memory here; the `mcp` service reaches it by name.
    ports:
      - "127.0.0.1:${CORTEX_PORT:-3141}:3141"
    volumes:
      - cortexdb-venice-embed-1:/data

  mcp:
    # The toolkit over MCP: `supermath-mcp serve` on stdio, for Claude Code
    # and other MCP clients. Opt-in (`--profile mcp`); it is run on demand,
    # not kept up:
    #
    #   claude mcp add supermath -- docker compose --profile mcp run --rm -T mcp serve my-project
    #
    # Built from docker/mcp/Dockerfile.
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    image: supermath-mcp:local
    stdin_open: true
    depends_on:
      cortexdb:
        condition: service_healthy
    environment:
      SUPERMATH_PROJECTS: /projects
      LEAN_URL: http://lean:3150
      PYTHON_URL: http://python:3160
      CORTEX_API_URL: http://cortexdb:3141
      CORTEX_API_KEY: ${CORTEX_API_KEY:-supermath-local}
      CORTEX_SCOPE_ROOT: ${CORTEX_SCOPE_ROOT:-ws:supermath}
      SUPERMATH_CONTACT: ${SUPERMATH_CONTACT:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # The Gemini model the web_* tools ground with, and their daily call cap;
      # unset keeps the crate's defaults.
      SUPERMATH_WEB_MODEL: ${SUPERMATH_WEB_MODEL:-}
      SUPERMATH_WEB_DAILY_CAP: ${SUPERMATH_WEB_DAILY_CAP:-}
    volumes:
      - projects:/projects
    networks:
      - default
      - internal
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  python:
    # The pinned Python solver service: one fresh, resource-limited subprocess
    # per run, no egress (it sits only on the `internal` network), and the
    # projects volume read-only. See docs/specs/toolkit/python/README.md.
    build:
      context: docker/python
    image: supermath-python:local
    restart: unless-stopped
    environment:
      SUPERMATH_PROJECTS: /projects
      PY_MAX_TIMEOUT_S: ${SUPERMATH_PY_MAX_TIMEOUT:-900}
      PY_MEMORY_MB: ${SUPERMATH_PY_MEMORY_MB:-4096}
      PY_MAX_CONCURRENT: ${SUPERMATH_PY_CONCURRENCY:-2}
    volumes:
      - projects:/projects:ro
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${SUPERMATH_PY_MEM_LIMIT:-8g}

  python-gateway:
    # Opt-in (`docker compose --profile host up`): publishes the python
    # service on 127.0.0.1:3160 for tools running on the host, so PYTHON_URL's
    # default http://localhost:3160 works. Docker does not forward published
    # ports into an `internal` network, so the service itself publishes none.
    profiles: ["host"]
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    depends_on:
      - python
    command: ["TCP-LISTEN:3160,fork,reuseaddr", "TCP:python:3160"]
    ports:
      - "127.0.0.1:${PYTHON_PORT:-3160}:3160"
    networks:
      - internal
      - default
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  lean:
    # The pinned Lean service: a toolchain and Mathlib fixed in docker/lean,
    # pooled REPLs behind a small HTTP API. Untrusted Lean runs here, so it
    # sits only on the `internal` network (no egress), as an unprivileged user
    # on a read-only root; the projects volume is the one writable path (it
    # builds each project's `lean/` package there). The first build downloads
    # Mathlib's cache and is slow. See docs/specs/toolkit/lean/README.md.
    build:
      context: docker/lean
    image: supermath-lean:local
    restart: unless-stopped
    environment:
      PROJECTS_DIR: /projects
      LEAN_POOL_SIZE: ${SUPERMATH_LEAN_POOL:-2}
      HOME: /tmp
    volumes:
      - projects:/projects
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${SUPERMATH_LEAN_MEM_LIMIT:-12g}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3150/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  lean-gateway:
    # Opt-in (`docker compose --profile host up`): publishes the lean service
    # on 127.0.0.1:3150 for tools running on the host, so LEAN_URL's
    # http://localhost:3150 works. Docker does not forward published ports into
    # an `internal` network, so the service itself publishes none.
    profiles: ["host"]
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    depends_on:
      - lean
    command: ["TCP-LISTEN:3150,fork,reuseaddr", "TCP:lean:3150"]
    ports:
      - "127.0.0.1:${LEAN_PORT:-3150}:3150"
    networks:
      - internal
      - default
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  # Named for the embedding model that fills it. CortexDB pins one embedding
  # space per store, so a new embedding model gets a new volume rather than
  # mixing spaces in one index; the ladder-era `cortexdb-data` volume (BGE-M3)
  # is left untouched for `docker volume rm`.
  cortexdb-venice-embed-1:
  projects:

networks:
  # No egress: services on it reach each other and nothing else.
  internal:
    internal: true
