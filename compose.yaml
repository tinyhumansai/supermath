# supermath: the agent runner, its model router, and its memory.
#
#   cp .env.example .env            # ladder key, OpenRouter, Surplus, Venice
#   git submodule update --init --recursive
#   docker compose up --build       # ladder + CortexDB, then `supermath-agent check`
#
# Three services:
#
#   ladder     the LLM ladder router: every chat completion and embedding
#   cortexdb   the memory server, one per deployment, data in a named volume
#   agent      `crates/supermath-agent`, embedding OpenHuman; `check` boots it
#              and reports whether the stack is ready
#
# The ladder holds the marketplace credentials. Everything else reaches it with
# one shared key, `LADDER_API_KEY`. The agent also calls OpenRouter directly,
# for Jev only: the decision model `tool_search` ranks deferred tools with.

x-ladder-url: &ladder-url http://ladder:6969/v1
x-ladder-key: &ladder-key ${LADDER_API_KEY:-supermath-ladder}

services:
  ladder:
    # Rebuilt and republished on every push to the router's main, so `latest`
    # plus `pull_policy: always` is how a router fix reaches this stack.
    # Published for amd64 only; Apple silicon runs it emulated, which is fine
    # for an I/O-bound proxy.
    image: ghcr.io/senamakel/llm-ladder-router:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    environment:
      # The key every caller must present. With it unset the router accepts
      # anyone, so it is always set here.
      LADDER_API_KEY: *ladder-key
      # Marketplace credentials. Rungs whose marketplace has no key fail and
      # the ladder moves on to the next rung.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SURPLUS_API_KEY: ${SURPLUS_API_KEY:-}
      VENICE_INFERENCE_KEY: ${VENICE_INFERENCE_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      RUST_LOG: ${LADDER_LOG:-info}
    # The ladders themselves (`flash`, `reasoning`, `vectors`, ...). Defaults to
    # the operator's router config; the image's bundled example has no working
    # `vectors` rung, so it is not a usable fallback.
    volumes:
      - type: bind
        source: ${LADDER_CONFIG_PATH:-${HOME}/.config/ladder/config.toml}
        target: /etc/ladder/config.toml
        read_only: true
    # Published on 6970 so it does not collide with a shared ladder already on
    # 6969. Containers reach it by name.
    ports:
      - "127.0.0.1:${LADDER_PORT:-6970}:6969"
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  cortexdb:
    # Pinned by digest, the release cortexdb-saas runs. The engine is a closed
    # vendor binary published for amd64 only.
    image: cortexdb/cortexdb:v0.10.4@sha256:636e0ed0b8cd4ae2f307e3a90f99050f7879f73c556b1ccbbabf2d3a383398fc
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - ladder
    environment:
      # The operator key every request carries as a bearer token. The agent
      # reads the same variable, so the two cannot drift.
      CORTEX_API_KEY: ${CORTEX_API_KEY:-supermath-local}
      CORTEX_V1_API_ADDR: 0.0.0.0:3141
      # Everything that thinks goes through the ladder. The server decides
      # whether it has a real provider at all from `OPENAI_API_KEY` /
      # `LLM_API_KEY`, so the ladder's key is given under that name too.
      OPENAI_API_KEY: *ladder-key
      LLM_API_KEY: *ladder-key
      # Embeddings on the `vectors` ladder (BGE-M3, 1024 wide). The server pins
      # the width on first ingest, so changing it needs a fresh volume.
      CORTEX_EMBEDDING_URL: *ladder-url
      CORTEX_EMBEDDING_MODEL: ${SUPERMATH_EMBEDDING_MODEL:-vectors}
      CORTEX_EMBEDDING_DIMS: ${SUPERMATH_EMBEDDING_DIMS:-1024}
      CORTEX_EMBEDDING_API_KEY: *ladder-key
      # Extraction, enrichment, answers and verification on the cheap `flash`
      # ladder. Enrichment builds facts from notes; unset turns it off.
      CORTEX_LLM_URL: *ladder-url
      CORTEX_LLM_MODEL: ${CORTEX_CHAT_MODEL:-flash}
      CORTEX_ENTITY_API_KEY: *ladder-key
      CORTEX_ENRICHMENT_DELAY_SECONDS: "0"
      CORTEX_ENRICHMENT_URL: *ladder-url
      CORTEX_ENRICHMENT_MODEL: ${CORTEX_CHAT_MODEL:-flash}
      CORTEX_ENRICHMENT_API_KEY: *ladder-key
      CORTEX_ANSWER_PROVIDER: openai
      CORTEX_ANSWER_URL: *ladder-url
      CORTEX_ANSWER_MODEL: ${CORTEX_CHAT_MODEL:-flash}
      CORTEX_ANSWER_API_KEY: *ladder-key
      CORTEX_VERIFIER_URL: *ladder-url
      CORTEX_VERIFIER_MODEL: ${CORTEX_CHAT_MODEL:-flash}
      CORTEX_VERIFIER_API_KEY: *ladder-key
      # Episodes, beliefs and concepts are built by a background scheduler
      # that is off unless this is set.
      CORTEX_V1_LAYERS_AUTO: "1"
      CORTEX_VECTOR_RESIDENT_MAX: ${CORTEX_VECTOR_RESIDENT_MAX:-200000}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3141/v1/admin/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: ${CORTEX_MEM_LIMIT:-4g}
    # Loopback only, for inspecting memory from the host. The agent reaches
    # the server by name on the compose network.
    ports:
      - "127.0.0.1:${CORTEX_PORT:-3141}:3141"
    volumes:
      - cortexdb-data:/data

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: supermath-agent:local
    depends_on:
      ladder:
        condition: service_started
      cortexdb:
        condition: service_healthy
    environment:
      LADDER_URL: *ladder-url
      LADDER_API_KEY: *ladder-key
      # The ladder's `flash` rungs, thinking at medium depth.
      SUPERMATH_MODEL: ${SUPERMATH_MODEL:-flash}
      SUPERMATH_REASONING_EFFORT: ${SUPERMATH_REASONING_EFFORT:-medium}
      SUPERMATH_EMBEDDING_MODEL: ${SUPERMATH_EMBEDDING_MODEL:-vectors}
      SUPERMATH_EMBEDDING_DIMS: ${SUPERMATH_EMBEDDING_DIMS:-1024}
      # Jev's decision calls, and nothing else.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CORTEX_API_URL: http://cortexdb:3141
      CORTEX_API_KEY: ${CORTEX_API_KEY:-supermath-local}
      CORTEX_SCOPE_ROOT: ${CORTEX_SCOPE_ROOT:-ws:supermath}
      SUPERMATH_WORKSPACE: /data/openhuman
      # The toolkit's project workspaces, and the Lean and Python services
      # that run what the agent writes there. Those two sit on `internal`
      # only, so the agent joins `internal` as well as `default` (which it
      # needs to reach the ladder, CortexDB and the internet).
      SUPERMATH_PROJECTS: /projects
      LEAN_URL: http://lean:3150
      PYTHON_URL: http://python:3160
      RUST_LOG: ${RUST_LOG:-warn}
    command: ["check", "${PROJECT:-scratch}"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - agent-data:/data
      - projects:/projects
    networks:
      - default
      - internal

  mcp:
    # The toolkit over MCP, without the agent: `supermath-mcp serve` on
    # stdio, for Claude Code and other MCP clients. Opt-in
    # (`--profile mcp`); it is run on demand, not kept up:
    #
    #   claude mcp add supermath -- docker compose --profile mcp run --rm -T mcp serve my-project
    #
    # Built from docker/mcp/Dockerfile, which never compiles OpenHuman.
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    image: supermath-mcp:local
    stdin_open: true
    depends_on:
      cortexdb:
        condition: service_healthy
    environment:
      SUPERMATH_PROJECTS: /projects
      LEAN_URL: http://lean:3150
      PYTHON_URL: http://python:3160
      CORTEX_API_URL: http://cortexdb:3141
      CORTEX_API_KEY: ${CORTEX_API_KEY:-supermath-local}
      CORTEX_SCOPE_ROOT: ${CORTEX_SCOPE_ROOT:-ws:supermath}
      SUPERMATH_CONTACT: ${SUPERMATH_CONTACT:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - projects:/projects
    networks:
      - default
      - internal
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  python:
    # The pinned Python solver service: one fresh, resource-limited subprocess
    # per run, no egress (it sits only on the `internal` network), and the
    # projects volume read-only. See docs/specs/toolkit/python/README.md.
    build:
      context: docker/python
    image: supermath-python:local
    restart: unless-stopped
    environment:
      SUPERMATH_PROJECTS: /projects
      PY_MAX_TIMEOUT_S: ${SUPERMATH_PY_MAX_TIMEOUT:-900}
      PY_MEMORY_MB: ${SUPERMATH_PY_MEMORY_MB:-4096}
      PY_MAX_CONCURRENT: ${SUPERMATH_PY_CONCURRENCY:-2}
    volumes:
      - projects:/projects:ro
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${SUPERMATH_PY_MEM_LIMIT:-8g}

  python-gateway:
    # Opt-in (`docker compose --profile host up`): publishes the python
    # service on 127.0.0.1:3160 for tools running on the host, so PYTHON_URL's
    # default http://localhost:3160 works. Docker does not forward published
    # ports into an `internal` network, so the service itself publishes none.
    profiles: ["host"]
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    depends_on:
      - python
    command: ["TCP-LISTEN:3160,fork,reuseaddr", "TCP:python:3160"]
    ports:
      - "127.0.0.1:${PYTHON_PORT:-3160}:3160"
    networks:
      - internal
      - default
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  lean:
    # The pinned Lean service: a toolchain and Mathlib fixed in docker/lean,
    # pooled REPLs behind a small HTTP API. Untrusted Lean runs here, so it
    # sits only on the `internal` network (no egress), as an unprivileged user
    # on a read-only root; the projects volume is the one writable path (it
    # builds each project's `lean/` package there). The first build downloads
    # Mathlib's cache and is slow. See docs/specs/toolkit/lean/README.md.
    build:
      context: docker/lean
    image: supermath-lean:local
    restart: unless-stopped
    environment:
      PROJECTS_DIR: /projects
      LEAN_POOL_SIZE: ${SUPERMATH_LEAN_POOL:-2}
      HOME: /tmp
    volumes:
      - projects:/projects
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${SUPERMATH_LEAN_MEM_LIMIT:-12g}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3150/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  lean-gateway:
    # Opt-in (`docker compose --profile host up`): publishes the lean service
    # on 127.0.0.1:3150 for tools running on the host, so LEAN_URL's
    # http://localhost:3150 works. Docker does not forward published ports into
    # an `internal` network, so the service itself publishes none.
    profiles: ["host"]
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    depends_on:
      - lean
    command: ["TCP-LISTEN:3150,fork,reuseaddr", "TCP:lean:3150"]
    ports:
      - "127.0.0.1:${LEAN_PORT:-3150}:3150"
    networks:
      - internal
      - default
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  cortexdb-data:
  agent-data:
  projects:

networks:
  # No egress: services on it reach each other and nothing else.
  internal:
    internal: true
