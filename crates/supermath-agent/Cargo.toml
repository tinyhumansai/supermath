[package]
name = "supermath-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A math problem-solving agent harness built on the embedded OpenHuman runtime, with CortexDB memory."
readme = "README.md"
keywords = ["agent", "mathematics", "openhuman", "cortexdb"]
categories = ["science"]
publish = false

[[bin]]
name = "supermath-agent"
path = "src/main.rs"

[dependencies]
# The embedded OpenHuman runtime: agent turns, tools, providers, and sessions.
# Default features because the facade's default set is what OpenHuman tests and
# ships; trimming it is a later optimisation. `mcp` lets the agent connect
# Jacobian and lean-lsp-mcp as stdio MCP servers (`AgentSpec::mcp`).
openhuman-embed = { path = "../../vendor/openhuman/crates/openhuman-embed", features = ["mcp"] }
# Only for `jev::TinyHumansJevRanker`, the Jev-backed `tool_search` ranker.
# Nothing hosted is installed: no TinyHumans login, transport, or provider.
openhuman-tinyhumans = { path = "../../vendor/openhuman/crates/openhuman-tinyhumans", default-features = false, features = ["jev"] }
# The OpenAI-compatible embedding client the Jev ranker's retriever uses to
# reach Surplus's embedding model. The same vendored path OpenHuman builds,
# so its `EmbeddingModel` trait is the one the ranker expects.
tinyinference-embeddings = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
# Host tools implement OpenHuman's asynchronous `Tool` trait.
async-trait = { workspace = true }
# The error type OpenHuman's `Tool::execute` returns.
anyhow = "1"
# The contract the host adapter wraps: `Tool`, `Exposure`, `Permission`, `Kind`.
supermath-tool = { path = "../supermath-tool" }
# The composed toolkit (`Config`, `Toolkit`) the agent links in process.
supermath-mcp = { path = "../supermath-mcp" }
# The agent_* tools, built on the same runtime the agent runs on.
supermath-subagents = { path = "../supermath-subagents" }
# The ledger's error type, for the readiness check on its memory client.
supermath-ledger = { path = "../supermath-ledger" }
# Tool envelopes are JSON values; the adapter adds the call id to each.
serde_json = { workspace = true }
# Derive macros for the crate-wide error type in `src/error/`.
thiserror = { workspace = true }
# The async runtime OpenHuman itself runs on.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }

[dev-dependencies]
# Temporary problem files for the loading tests.
tempfile = { workspace = true }

[lints]
workspace = true
